syntax = "proto3";

package ntech.nvision.engine.v1;

service EngineHost {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc PreparePackage(PreparePackageRequest) returns (PreparePackageResponse);
  rpc ActivatePackage(ActivatePackageRequest) returns (ActivatePackageResponse);
  rpc Inspect(InspectRequest) returns (InspectResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc GetState(GetStateRequest) returns (GetStateResponse);
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  uint32 contract_version = 1;
  uint32 native_abi_version = 2;
  string engine_version = 3;
  repeated string features = 4;
}

message PreparePackageRequest {
  string candidate_id = 1;
  string package_path = 2;
  string expected_sha256 = 3;
}

message PreparePackageResponse {
  bool ready = 1;
  repeated Diagnostic diagnostics = 2;
}

message ActivatePackageRequest {
  string candidate_id = 1;
}

message ActivatePackageResponse {
  string active_deployment_id = 1;
}

message InspectRequest {
  string inspection_id = 1;
  string recipe_id = 2;
  string correlation_id = 3;
  SharedFrameDescriptor input_frame = 4;
}

message InspectResponse {
  string inspection_id = 1;
  string status = 2;
  string decision_code = 3;
  bytes result_payload = 4;
}

message CancelRequest {
  string inspection_id = 1;
}

message CancelResponse {
  bool accepted = 1;
}

message GetStateRequest {}

message GetStateResponse {
  string state = 1;
  string active_deployment_id = 2;
  repeated Diagnostic diagnostics = 3;
}

message SharedFrameDescriptor {
  string region_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 stride_bytes = 6;
  string pixel_format = 7;
  uint64 generation = 8;
  string lease_token = 9;
}

message Diagnostic {
  string code = 1;
  string severity = 2;
  string message = 3;
  string path = 4;
}
